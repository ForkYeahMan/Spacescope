[package]
name = "spacescope"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "See what is using your disk, browse it folder by folder, and move the junk to the Trash. A local web app for macOS, Linux and Windows."
readme = "README.md"
license = "MIT"
keywords = ["disk", "cleaner", "storage", "monitor", "dashboard"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.7"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
futures = "0.3"
humansize = "2.1"
mime_guess = "2.0"
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.5"
tokio = { version = "1.42", features = ["full"] }
trash = "5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
