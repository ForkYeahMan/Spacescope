<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Spacescope</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <!-- Apply the saved theme before first paint to avoid a flash. -->
  <script>
    try {
      const t = JSON.parse(localStorage.getItem("spacescope:theme"));
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="preload" href="/assets/fonts/dosis-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/charts.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Spacescope needs JavaScript to run.</p></noscript>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
